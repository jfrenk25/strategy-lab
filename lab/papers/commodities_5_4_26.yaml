notes: "Same authors and same design as jrfm_19_9_692 (bitcoin and ether sessions). The result is a negative one by the authors' own account, so there is little to chase even with the data. Figures other than the abstract's came from the helper's summary of the later sections. The gold fund here is not the lab's gold: spot gold trades through the US night, so it has no close-to-open gap to trade."
