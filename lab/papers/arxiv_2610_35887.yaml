notes: "The author's own conclusion is that the signal mostly repeats the daily trend and that six trades prove nothing. Left unclear: what makes an entry bar 'qualifying', whether the 106.38-point cut-off was fixed in advance, and position size. Not turned into a screen trigger: sweeping a prior range and closing back inside is the built-in `sweep` event."
