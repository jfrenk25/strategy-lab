notes: "The authors' own result is a null: positive in 2020 to 2024, negative in 2015 to 2019, not significant overall, and they note the stock list has survivorship bias. The methods reached the lab partly as a machine summary of a truncated page; Appendix B with the setup thresholds was not read, so the setups cannot be coded from this file. The arXiv stamp is 15 December 2025 while the paper body carries a date of 24 August 2026. No trigger was made: volume ratio is the built-in vol_spike and price efficiency is the same idea as a158_rsqr."
