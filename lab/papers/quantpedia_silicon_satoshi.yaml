notes: "A vendor's research post, not a paper on arXiv, SSRN or NBER; picked up from a web search. The lab holds both markets from April 2021, but the rule was not coded, for two reasons. First, the exit is unclear in what was read, and guessing it would make the test the lab's rule, not the write-up's. Second, it is a trend breakout in position mode, and the lab's own notes close that class after two failures (ts_momentum, valeyre_ema_trend) and after the built-in breakout trigger confirmed nothing. Eight lookbacks and two orderings were shown with no costs on a period when both assets rose strongly. Testing it would need Jeff's go-ahead and a reading of the exit. It cites a companion paper on gold and bitcoin (SSRN 6729918), which could not be opened."
