notes: "The lab has the S&P 500 index but none of the nine sector funds, and the signal is built only from them, so nothing was approximated. The range of X called robust was picked after looking at the results on the same data, so the example figures are in-sample. The gain over holding SPY is small (Sharpe 0.58 against 0.52). Unclear: the sample dates, whether the one-day short ends at the next open or the next close, and costs. The author names no loser."
