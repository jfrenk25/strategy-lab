formulas:
  - name: "Average sector correlation"
    definition: "corrN(t) = mean over the 36 pairs (i, j) of Pearson correlation of daily returns of fund i and fund j over the last N days"
    variables: "N is 20 for the fast measure and 60 for the slow one. Nine funds give 36 pairs."
  - name: "Acceleration test"
    definition: "signal(t) = 1 if corr20(t) > X * corr60(t), else 0"
    variables: "X is tried from 1.00 to 1.25 in steps of 0.01. The author calls 1.12 to 1.25 the robust region; the worked example uses 1.13."
