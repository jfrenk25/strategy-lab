notes: "Not coded. Three reasons. (1) The entry is a moving-average (MACD) crossover on price alone, a class the lab's notes close; the same call was made for jrfm_19_3_192. (2) The rule's exit is its own: sell at the close of the first falling 1-hour bar. Signal mode leaves only by an ATR stop or target, and position mode holds daily bars, so neither engine can run it as written. It would need its own registered study. (3) No costs are stated. With about 1,000 trades in seven years and the lab's bitcoin cost of 0.065% a side, costs alone would take about 0.13% a trade, roughly 19% a year against a reported 6.6% a year for the one-bar version. The lab does hold hourly bitcoin, but from April 2021 on a different exchange. Unclear: the fill price at entry, the size of each trade, and whether the MACD is read on finished bars. The post says nothing was optimised and shows no held-out test. The author names no loser."
