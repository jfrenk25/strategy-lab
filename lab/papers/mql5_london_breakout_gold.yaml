notes: "Not coded. The lab holds 1-hour gold, which is enough to find the range, but the rule cannot be run as written. (1) Its exits are its own: a stop at the range edge with a cap, a move to break-even at 1.5R and a clock exit at 21:00. Signal mode leaves only by an ATR stop or target. It would need its own registered study, like the intraday studies. (2) The post withholds the size of the entry buffer and the server's time zone, so the five range hours cannot be placed in UTC without a guess. (3) The built-in session_open trigger and the registered opening_range_break and open_distance triggers already screen breaks of an early-session range on gold, and none was confirmed. The sample starts in 2023, three years in which gold rose strongly, and the settings were chosen on 2023 to 2025. A vendor's backtest of a product on sale is not independent evidence. The author names no loser."
