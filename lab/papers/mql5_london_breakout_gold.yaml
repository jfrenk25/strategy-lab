rules:
  entry_long: "At 08:00 place a buy stop a small distance above H. If it fills, the sell order is cancelled."
  entry_short: "At 08:00 place a sell stop a small distance below L. If it fills, the buy order is cancelled."
  exit: "Stop at the other side of the range, but never further than 0.6% of price. Target at 2.5 times the risk. When the trade is 1.5 times the risk ahead the stop moves to the entry price. Everything is closed at 21:00."
  holding_period: "Within the day, 13 hours at most"
