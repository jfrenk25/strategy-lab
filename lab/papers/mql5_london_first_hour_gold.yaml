notes: "Not coded. The lab holds the bars the base rule needs, but its exit is a clock time, which neither signal mode nor position mode has; it would need its own registered study, and there is little reason to ask for one, because the author's own count shows the rule doing no better than trading the same way every day, before any cost. Written up as a stated rule with a reported null. The post gives win shares, not returns, so its 'ahead' rates cannot be turned into a profit factor. The registered `session_open` and `lagged_session_sign` parts already screen 'the way the hours before a session went' with the lab's exits, so no trigger was made from it."
