notes: "Not coded on 2026-11-21, for two reasons. First, this is time-series trend following in position mode, the class the lab rejected on 2026-11-19 (`ts_momentum`, Sharpe 0.05); AGENT.md says not to re-test a failed class unless the new idea uses different information, and a different average of the same returns does not. Second, the signal's exact recursion and the reported Sharpe figures come from a summary of the cut-off part of the page, not from the text itself. The author's fit is in-sample and he notes the trend strength has been falling over time. If Jeff wants it tested anyway, read the signal equations first and use the equal-weight version on all fifteen markets."
