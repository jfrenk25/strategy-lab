notes: 'Tested at Jeff''s request on 2026-11-21 although it is time-series trend following, the class rejected on
  2026-11-19 (`ts_momentum`). The signal and position equations were read word for word in a second pass. Coded:
  the naive version (correlation matrix set to identity), which the paper runs as ''exactly the same computation''.
  Not coded: the main version, because the matrix-cleaning step was not read. So the lab''s number is not comparable
  with the 1.24 the paper reports, and the paper gives no figure for what was coded. Lab choices where the paper
  is silent: a 40-return start-up, no position before 250 returns, and a 2% volatility target so the lab''s exposure
  cap does not bind. The paper''s fit is in-sample, and the author notes that trend strength has been falling.'
