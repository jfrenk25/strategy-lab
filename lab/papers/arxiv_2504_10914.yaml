formulas:
  - name: "Trend model"
    definition: "r_t = e_t + B x sum over k of (1 - L)^(t-1-k) x x_k."
    variables: "r: daily return. e, x: independent shocks. L: how fast the hidden trend fades. B: its strength."
  - name: "Best time scale"
    definition: "eta_opt = L x sqrt(1 + 2 B0^2 / L), with B = B0 x sqrt(L (2 - L))."
    variables: "eta: the smoothing constant of the trend-following average. The fit gives L about 1/180 and B0 about 0.12."
  - name: "Signal"
    definition: "An exponential average, smoothing constant eta = 1/120, of each market's daily return divided by its 40-day exponential volatility."
    variables: "The exact recursion sits in a part of the page that was not read word for word."
  - name: "Position"
    definition: "Proportional to the signal (not just its sign), spread over markets either equally or by 'agnostic risk parity' (the signal multiplied by the inverse square root of the correlation matrix), then scaled to a constant expected volatility."
    variables: "Correlation matrix: 750-day exponential average of weekly returns, cleaned. Smoothing 1/20."
rules:
  entry_long: "Hold a long position in a market in proportion to its positive signal."
  entry_short: "Hold a short position in proportion to a negative signal."
  exit: "None as such: the position shrinks to zero as the signal does."
  holding_period: "Continuous, rebalanced daily."
reported_results:
  sample_period: "May 1990 to December 2023"
  markets: "73 futures"
  headline: "Sharpe before costs about 1.24 for time scales of 80 to 120 days; a three-average mix does no better (1.21). Standard error about 0.18."
