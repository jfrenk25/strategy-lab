id: arxiv_2504_10914
title: 'Breaking the Trend: How to Avoid Cherry-Picked Signals'
authors: Sebastien Valeyre
published: '2025-04-01'
url: https://arxiv.org/abs/2504.10914
found: '2026-11-21'
status: tested
market: '73 futures: about 32 commodities and 41 stock indices, bonds and currencies'
timeframe: Daily bars; position adjusted every day
data_needed:
- daily closes for each market
- about a year of history before the first position
- 'for the main version: weekly returns of all markets for a correlation matrix (750-day average)'
testable_here: true
why_not: ''
missing_data: []
formulas:
- name: Trend model
  definition: r_t = e_t + B x sum over k of (1 - L)^(t-1-k) x x_k.
  variables: 'r: daily return. e, x: independent shocks. L: how fast the hidden trend fades. B: its strength.'
- name: Best time scale
  definition: eta_opt = L x sqrt(1 + 2 B0^2 / L), with B = B0 x sqrt(L (2 - L)).
  variables: 'eta: the smoothing constant of the trend-following average. The fit gives L about 1/180 and B0 about
    0.12.'
- name: Signal
  definition: sigma2_t = (1 - eta) x sigma2_(t-1) + eta x r_t^2; phi_t = (1 - eta) x phi_(t-1) + sqrt(eta) x r_t
    / sigma_(t-1).
  variables: 'r: daily log return. eta: 1/120 or 1/100 in the reported runs (the theory''s best value is 1/72).
    sqrt(eta) makes phi have a spread of about 1.'
- name: Position
  definition: hat_(t+1) = (1 - rho) x hat_t + rho x phi_t / s_t (naive version) or rho x S^-1 x C^-0.5 x phi_t (main
    version); position = hat / sqrt(hat' S C S hat).
  variables: 's: standard deviation from a 40-day exponential average of daily returns; S: the same on a diagonal.
    C: correlation matrix from a 750-day exponential average of weekly returns, cleaned (identity in the naive version).
    rho = 1/20.'
rules:
  entry_long: Hold a long position in a market in proportion to its positive signal.
  entry_short: Hold a short position in proportion to a negative signal.
  exit: 'None as such: the position shrinks to zero as the signal does.'
  holding_period: Continuous, rebalanced daily.
reported_results:
  sample_period: May 1990 to December 2023
  markets: 73 futures
  headline: 'Main version (with the correlation matrix): Sharpe before costs 1.24 at a 120-day scale and 1.25 at
    100 days; a three-average mix 1.18. Error about 0.18 on each. No Sharpe figure is given for the naive version,
    only a chart.'
  costs_included: No. The author says costs are very small at this trading speed.
