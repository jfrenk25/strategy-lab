notes: "Third paper of this design from the same group (see jrfm_19_9_692 and commodities_5_4_26). The page read has inconsistent figures: two different buy-and-hold values for SPY, two sample lengths, and a Sharpe ratio printed as both 1.61 and 0.61 for one strategy. The helper read the start and a later part of a long page; some tables were not seen. The edge, where there is one, is gone at a cost of 0.02% a trade by the authors' own tables. Even with the data it would also need an exit at a set time, which the lab's engines lack."
