notes: "Not coded. The lab holds 1-hour gold, but the rule leaves at a set clock time and has no stop or target, and signal mode leaves only by an ATR stop or target while position mode holds daily bars that roll at 22:00 UTC. As with jrfm_19_9_692 it would need its own registered study with a time exit, and Jeff's go-ahead. Points against it, all from the post itself: it is the one survivor of about 49,000 variants tried on the same history, so its t of 2.86 is far below any bar that counts those tries; the whole gain comes from mid-2020 on, years in which gold rose strongly; one of the four evenings loses; and adding Sunday evening cuts it to +1.56 (t 1.68). The post's money simulation uses a different rule (three evenings and a 2.3% stop). The lab's built-in clock trigger already screens 'gold at a given hour' with the lab's exits. The author gives a session reason (reopen to London start) but names no loser."
