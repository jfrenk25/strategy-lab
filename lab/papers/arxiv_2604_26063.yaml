notes: "Not coded. Three reasons. (1) It is a moving-average (MACD) crossover with a volume weighting, a class the lab's notes close; the same call was made for jrfm_19_3_192 and quantpedia_btc_mtf_macd. (2) Two settings are missing from the text read: the length N of the price window and the window of the range's standard deviation. Lambda is fitted per index, and the fitted values were seen only in a summary. Any numbers the lab chose would be the lab's. (3) The test rests on 6 to 21 trades per fund in three rising years, which cannot tell the rule from holding the fund. The lab holds the three indices as CFD prices with a data vendor's volume, not the funds' own volume, which the formula leans on. The last part of the paper was read only through the helper's summary. The authors name no loser."
