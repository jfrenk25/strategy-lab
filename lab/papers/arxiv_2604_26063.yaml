formulas:
  - name: "Adjusted price"
    definition: "P*(t) = sum over the N bars before t of [ C(i) * V(i) * s(i) * r(i) ] / sum of V(i)"
    variables: "C: close. V: volume. s(i): standard deviation of (high - low) divided by the close. r(i): |close - open| / (high - low). N and the window of the standard deviation are not given in the text read."
  - name: "VP-MACD and its signal line"
    definition: "M = EMA(P*, 12) - EMA(P*, 26); S = EMA(M, 9)"
    variables: "EMA(x, n): exponential moving average over n daily bars."
rules:
  entry_long: "Buy when M crosses above lambda * S: M(t-1) <= lambda * S(t-1) and M(t) > lambda * S(t). Lambda lies between 0.8 and 1.0 and is picked for each index on 2018 to 2022. The order is filled at the next day's open."
  entry_short: "None. The rule is long or in cash."
  exit: "Sell when M crosses below S (the plain cross, with no lambda). Filled at the next day's open."
  holding_period: "Not fixed. The whole account is in the fund or in cash."
reported_results:
  sample_period: "Settings chosen on 2018 to 2022 (1,259 days); tested on 2023 to February 2026 (791 days)"
  markets: "SPY, QQQ, DIA"
  headline: "From the helper's summary of the results tables, not checked word for word: on the test years the adjusted rule made a Sharpe of about 0.96 on SPY (6 trades), 1.51 on QQQ (21 trades) and 1.08 on DIA; the plain MACD made 0.47 on SPY (40 trades)."
  costs_included: "Yes: 0.04% a side (0.03% fee and 0.01% slippage)."
