formulas:
  - name: "Local maximum and minimum"
    definition: "MAX_t(x) = highest price of the last x days; MIN_t(x) = lowest price of the last x days"
    variables: "x: lookback of 10, 20, 30, 40 or 50 days. The post's own formula is an image that was not read, so whether day t itself is inside the window is not known."
rules:
  entry_long: "Combined version: hold bitcoin when today's price is at its x-day maximum or at its x-day minimum. The post also shows each leg alone (at the maximum only: trend; at the minimum only: reversal)."
  entry_short: "None. The rule is long or flat."
  exit: "Flat on any day the price is at neither extreme. The post gives no other exit; its wording about 'the following day' implies the position earns the next day's return."
  holding_period: "One day at a time"
reported_results:
  sample_period: "26 November 2015 to 3 February 2022"
  markets: "Bitcoin, daily prices from Gemini"
  headline: "Combined version: 98.43% a year, volatility 47.75%, largest fall -37.67%, return over volatility 2.06. Holding bitcoin: volatility 74.35%, largest fall -83.65%. Shorter lookbacks did best. The minimum-only leg had falls of over 80%."
  costs_included: "No costs are mentioned"
