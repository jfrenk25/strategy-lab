notes: "Not coded. Three reasons. (1) Half of the rule, holding bitcoin on days it sits at its x-day high, is a daily breakout trend rule in position mode; the lab's notes close that class after two failures (ts_momentum, valeyre_ema_trend), and the same call was made for quantpedia_silicon_satoshi. It needs Jeff's go-ahead. (2) The post's formula is an image that was not read, and the text does not say which lookback gives the headline result or which hour ends its day, so a coded version would rest on the lab's guesses. (3) No costs are stated: the rule is in and out of the market often, and the lab's bitcoin cost in position mode is 0.13% per change of weight. The lab does hold hourly bitcoin from April 2021 (Bitstamp, not Gemini), so if Jeff approves a test the open points are the window (with or without today) and the lookback (the five values could be the walk-forward grid). Everything reported is in-sample and ends in February 2022; the authors name no loser and cite no paper for the idea."
