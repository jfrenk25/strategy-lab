notes: "Not a timing rule: it is a standing short of two funds, and what it earns is set by their decay against their borrow fees. The lab's Nasdaq 100 bars cannot stand in for either fund, because the funds' own prices carry the daily reset, fees and financing. The authors' own numbers leave little after costs and they say the gains come in bursts of high volatility. A short of a three-times fund can lose more than the account in a sharp one-way move; the post's worst falls were not in the text read."
