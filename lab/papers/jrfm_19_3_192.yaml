notes: "Not coded. Three reasons. (1) It is a moving-average crossover on price alone, a class the lab's notes close ('Do not add more of them'); SuperTrend and two other indicator mixes lost on both sides in the screen. (2) The rule as written needs exits the lab's engines do not have: fills at the next day's close and stops and targets set as a percent of the entry price. Signal mode uses ATR stops on 1-hour bars; position mode has no stop at all. (3) The paper recommends a group of 160 parameter sets and no single one, so any one set would be the lab's pick. The lab does hold gold, but only from April 2021, so the paper's own years (2011 to 2021) cannot be re-run and almost all of the lab's data is after publication. Unclear in the paper: whether stops are checked on daily highs and lows or on closes, and whether the Sharpe ratio is yearly. No costs, and the good ranges were found on the same decade they are reported on (2020 to 2021 is the only held-out part). The author names no loser."
