notes: "Not coded. The lab holds 1-hour S&P 500 bars, but the rule enters and leaves at set clock times. Signal mode leaves only by an ATR stop or target and position mode holds daily bars, so neither engine can run it as written; it would need its own registered study with a time exit and Jeff's go-ahead, like jrfm_19_9_692 and mql5_gold_night_hold. Two round trips a day on the index would cost about 0.02% a day at the lab's table (roughly 5% a year) before any slippage, and the post states no costs and no average hourly return in text to set against that. The hours were picked on the same sample they are shown on; the author calls the pattern undocumented and names no loser. The lab's S&P 500 bars are a CFD's from April 2021, in UTC, so 11:00 New York moves between 15:00 and 16:00 UTC with daylight saving. A single clock hour is the built-in clock trigger with a different number, so no trigger was written."
