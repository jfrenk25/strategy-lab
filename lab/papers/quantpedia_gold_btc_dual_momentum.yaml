notes: "Not coded. The lab holds spot gold and bitcoin, and a weekly rule can be run on daily bars in position mode. But this is a momentum rotation with a trend filter, and the lab's notes close that class after two failures (`ts_momentum`, `valeyre_ema_trend`: both made money and neither beat the same positions held weeks late). The idea adds no new information to those, only a two-asset basket, so it should not be a third attempt without Jeff's go-ahead. Sister post to `quantpedia_silicon_satoshi`, which waits for the same reason. Cautions: the lookbacks were compared on the same seven years they are reported on, with no held-out data; the signal and the trade use the same Wednesday close; no costs; the sample is one bitcoin boom and a strong gold run. Two sets of figures for the capped version disagree on the page. Per-lookback tables are images and were not read. A fund is not the lab's spot price, and from April 2021 the lab would cover only about five of the page's seven years."
