notes: "Kept on 2026-11-21, read in full on 2026-11-23. About 30,000 trades in four years at zero cost: at the lab's fees (0.03% a side for bitcoin) the cost alone would be many times the reported gain. Unpublished: indicator lengths, the Bollinger width, eps, the backtest normalisation window, L1, L2, A and their grids. theta was chosen from a chart of the whole sample, so it is not purely walk-forward. The formulas for the four indicators and the results reached the lab as a machine summary. The class (a mix of RSI, MFI, MACD and Bollinger) is the indicator-mix class that has lost every time in this lab; no trigger was made."
