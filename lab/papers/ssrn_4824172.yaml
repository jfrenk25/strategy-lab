notes: "The full text opened on 2026-11-27 from the University of St. Gallen's repository (SSRN itself refuses). Left unclear by the paper: whether fills are at the bar's close, how a stop between two half-hour marks is handled, and any out-of-sample check of VM = 1. The typical move is defined as a 14-day average in one place and with a divisor of 13 in another. The authors run trading businesses. A related SSRN paper found by title only, not read: an independent replication and audit (7323419). The band itself needs only an open and a time of day, so a one-market cousin of it on 1-hour bars went into the screen as the trigger `noise_band_break`; that screens the event with the lab's exits and is not a test of this paper."
