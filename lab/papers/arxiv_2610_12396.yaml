may_stop_working: ""
notes: "The entry is a moving-average crossover, a class the lab's notes close; the paper's addition is the size rule. By the authors' own account the figures are in-sample: the embedding settings were picked by Sharpe on the same data out of 72 combinations, and the scored version beats the plain cross on Sharpe in only 22 of 72 (bitcoin) and 26 of 72 (SPY) of them. It earns less than holding on both markets. Unclear: whether a score of exactly 0.60 is flat or not (the text says both), and the publication day. Read through a summary of the PDF on 2026-11-27; the weights and thresholds above come from that reading."
