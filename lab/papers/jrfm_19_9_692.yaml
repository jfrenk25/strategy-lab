notes: "Not coded, and not for lack of data: the lab holds hourly BTCUSD and ETHUSD from April 2021. The lab cannot run the rule as written. Signal mode closes every trade with an ATR stop or target and has no exit at a set time; position mode holds daily bars that roll at 22:00 UTC, so neither can hold a 12-hour session starting at 05:00 or 08:00. Forcing it into either would be an approximation. A proper test needs its own registered study with a time exit, as the intraday studies had: Jeff's call. To settle first: whether an hourly bar is stamped with its opening or closing time (the paper does not say; the authors' code on GitHub was not opened), and whether the first session pays a cost. Cautions: the rules are the best of 300 on the same data, the authors' own tests do not separate them from buy and hold, and the lab's bitcoin fee (0.03% a side plus slippage) is above the paper's break-even cost. The authors name no loser; they suggest the Asia-to-Europe handover and say it is not shown. A screen trigger, `lagged_session_sign`, was made from the signal on 2026-11-22: that is the event screen, not a test of this paper."
