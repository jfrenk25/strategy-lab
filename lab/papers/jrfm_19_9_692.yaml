formulas:
  - name: "Sessions"
    definition: "For a start hour h (UTC, 0 to 11): day session D = hours [h, h+12), night session N = hours [h+12, h+24). For date t the night runs from hour h+12 on t-1 to hour h on t and comes first; the day session follows."
    variables: "h: the UTC hour at which the day session starts. Session return R = product of (1 + hourly simple return) over the session's 12 hours, minus 1, from hourly closes."
  - name: "Positions"
    definition: "z = 0 (Cash), +1 (Long), -1 (Short), sign(R of the same session type one date earlier) (Momentum), or minus that sign (Reversal). A lagged return of zero, or none, gives Cash."
    variables: "z: the position held through one session, set before it starts. The lag is the same kind of session a day earlier (night looks at the night before, day at the day before), not the session that has just ended."
  - name: "Strategy pair"
    definition: "A strategy is (night rule, day rule), each one of the five positions: 25 pairs, 24 of them active, tried at 12 start hours."
    variables: "Written night first: Long/Reversal means long every night and Reversal every day."
  - name: "Net return"
    definition: "Q_i = |z_i - z_(i-1)| over the sequence of sessions; net session return = (1 + z_i x R_i) x (1 - c x Q_i) - 1."
    variables: "c: cost per unit of position change, 0, 1 or 2 hundredths of a percent. Wealth starts at 100 and compounds session by session."
rules:
  entry_long: "Bitcoin (full-sample pick, Reversal/Reversal, h = 8): at 08:00 and 20:00 UTC go long for the next 12 hours if the same 12-hour window a day earlier fell. Ether (Long/Reversal, h = 5): long every night session from 17:00 to 05:00 UTC; at 05:00 go long for the day session if yesterday's day session fell."
  entry_short: "Bitcoin: short for the next 12 hours if the same window a day earlier rose. Ether: short for the day session (05:00 to 17:00) if yesterday's day session rose. The night leg for ether is never short."
  exit: "At the end of the 12-hour session; the next session's position replaces it. No stop and no target."
  holding_period: "12 hours"
reported_results:
  sample_period: "1 January 2016 to 31 December 2025; rules also picked on 2016 to 2020 and held fixed for 2021 to 2025"
  markets: "BTCUSD and ETHUSD on Kraken"
  headline: "Wealth from 100 over the full sample, no costs: bitcoin Reversal/Reversal 95,015 against 20,216 for buy and hold; ether Long/Reversal about 58 times buy and hold. At 0.02% per change: bitcoin 21,258 against 20,212; ether about 13 times buy and hold. No difference from buy and hold is statistically significant (bootstrap intervals contain zero; Hansen SPA p-values 0.90 to 1.00 for bitcoin, 0.66 to 0.77 for ether). Held-out years 2021 to 2025: the bitcoin rule picked on 2016 to 2020 (Momentum/Long, h = 11) lost 29.1% before costs; the ether rule (Long/Reversal, h = 5) stayed ahead of buy and hold at all three cost levels. Break-even cost about 0.021% for bitcoin and 0.056% for ether. Sharpe ratios and drawdowns are in tables published as images and were not read."
  costs_included: "As scenarios only: 0, 0.01% and 0.02% per unit of position change. Spread, slippage, borrowing and funding are left out."
